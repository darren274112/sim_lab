name: 感知 A/B —— 基线（K8S 就绪轮询，无链路追踪）
namespace: sim-test
vars:
  target_service: fire-control
  scenario: battalion_attack
  trace_lookback_s: 900

# 与 configs/ab_trace.yaml 的步骤/时序完全一致，只有感知算法不同：
#   本文件 = fault_detect_baseline（K8S 就绪轮询）
#   ab_trace = fault_detect_dl（PCA+AE+PCA 注意力 + 真实 Trace 定位）
steps:
  - id: baseline
    name: 采集真实基线指标
    action: obs.collect_baseline
    timeout: 60

  - id: traffic_normal
    name: 正常态业务流量
    action: traffic.probe
    params:
      requests: 5
      interval_s: 0.2
    timeout: 120

  - id: inject
    name: 注入微服务故障（pod-kill）
    action: fault.inject_pod_kill
    params:
      service: "${vars.target_service}"
    record_time: inject_time
    timeout: 60

  - id: traffic_fault
    name: 故障期间业务流量
    action: traffic.probe
    params:
      requests: 8
      interval_s: 0.3
    timeout: 180

  - id: detect
    name: 故障感知（基线：K8S 就绪轮询）
    action: algo.run_detect
    params:
      algo: fault_detect_baseline
    timeout: 180

  - id: measure_latency
    name: 计算故障感知延迟
    action: measure.detect_latency
    timeout: 10

  - id: trace
    name: 采集真实 Trace（只做旁证，不参与判定）
    action: trace.collect
    params:
      lookback_s: "${vars.trace_lookback_s}"
      limit: 120
    timeout: 120

  - id: summary
    name: 实验汇总
    action: measure.summary
    timeout: 10
