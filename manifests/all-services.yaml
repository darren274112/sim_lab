apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-bridge
  namespace: sim-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-bridge
  template:
    metadata:
      labels:
        app: sim-bridge
        tier: core
    spec:
      containers:
      - name: sim-bridge
        image: sim/sim-bridge:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: MIL_SIM_PATH
          value: "/app/ross-sim/build/mil_sim"
