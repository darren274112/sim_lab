apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-store
  namespace: sim-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: state-store
  template:
    metadata:
      labels:
        app: state-store
        tier: core
        criticality: P1
    spec:
      containers:
      - name: state-store
        image: sim/state-store:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        # 每个副本用 Pod 名作为稳定 ID（LWW 冲突裁决的最终依据）
        - name: REPLICA_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # 通过无头 Service 的 A 记录发现其它副本
        - name: HEADLESS_HOST
          value: state-store-headless
        # 反熵周期：故障注入期间可观察"副本分叉 -> 自动收敛"
        - name: ANTI_ENTROPY_INTERVAL
          value: "5"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "192Mi"
            cpu: "300m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
---
