apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: sim-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        tier: core
    spec:
      containers:
      - name: orchestrator
        image: sim/orchestrator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
