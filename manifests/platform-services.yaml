# 通用平台微服务：认证、配置、通知、平台信息、混沌编排、API 网关
# 与核心仿真服务（all-services.yaml）分离，可按需单独部署/裁剪。
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: sim-test
type: Opaque
stringData:
  AUTH_SECRET: "sim-lab-dev-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sim-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: platform
        criticality: P2
    spec:
      containers:
      - name: auth-service
        image: sim/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: AUTH_SECRET
        - name: AUTH_TTL_S
          value: "3600"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "192Mi"
            cpu: "250m"
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: sim-test
spec:
  selector:
    app: auth-service
  ports:
  - port: 8080
    targetPort: 8080
---
