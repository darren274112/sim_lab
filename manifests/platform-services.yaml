apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-service
  namespace: sim-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-service
  template:
    metadata:
      labels:
        app: eval-service
        tier: platform
        criticality: P2
    spec:
      containers:
      - name: eval-service
        image: sim/eval-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: RUNS_DIR
          value: /runs
        volumeMounts:
        - name: runs
          mountPath: /runs
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "192Mi"
            cpu: "250m"
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 15
      volumes:
      - name: runs
        hostPath:
          path: /mnt/hgfs/code/sim_lab/runs
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: eval-service
  namespace: sim-test
spec:
  selector:
    app: eval-service
  ports:
  - port: 8080
    targetPort: 8080
