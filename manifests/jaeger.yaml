apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: sim-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        tier: observability
    spec:
      containers:
        - name: jaeger
          image: sim/jaeger:latest
          imagePullPolicy: IfNotPresent
          # 基础镜像自带 uvicorn CMD，这里用 command+args 完全覆盖 entrypoint/cmd
          command: ["/usr/local/bin/jaeger-all-in-one"]
          args:
            - "--memory.max-traces=20000"
            - "--collector.otlp.enabled=true"
            - "--query.base-path=/"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-http
              containerPort: 4318
            - name: otlp-grpc
              containerPort: 4317
            - name: thrift-http
              containerPort: 14268
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: sim-test
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: thrift-http
      port: 14268
      targetPort: 14268
