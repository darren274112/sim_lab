# chaos-service 的最小权限 RBAC：仅允许在本命名空间内操作 Pod 与 Deployment 副本数
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sim-chaos
  namespace: sim-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sim-chaos-role
  namespace: sim-test
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sim-chaos-binding
  namespace: sim-test
subjects:
- kind: ServiceAccount
  name: sim-chaos
  namespace: sim-test
roleRef:
  kind: Role
  name: sim-chaos-role
  apiGroup: rbac.authorization.k8s.io
