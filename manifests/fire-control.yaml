apiVersion: apps/v1
kind: Deployment
metadata:
  name: fire-control
  namespace: sim-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fire-control
  template:
    metadata:
      labels:
        app: fire-control
        tier: core
        criticality: P0
    spec:
      containers:
      - name: fire-control
        image: sim/fire-control:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: fire-control
  namespace: sim-test
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: fire-control
